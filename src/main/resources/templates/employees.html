<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<h2 class="mb-4">Employee Management System</h2>

<!-- Search Form (Challenge Task 11) -->
<form th:action="@{/employees}" method="get" class="input-group mb-4">
    <input type="text" name="keyword" class="form-control" placeholder="Search by name..." th:value="${keyword}">
    <button class="btn btn-outline-secondary" type="submit">Search</button>
    <a th:href="@{/employees}" class="btn btn-outline-dark">Reset</a>
</form>

<!-- Registration Form -->
<div class="card mb-4">
    <div class="card-header bg-primary text-white">Add New Employee</div>
    <div class="card-body">
        <form th:action="@{/employees}" th:object="${employee}" method="post">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" th:field="*{fullName}" class="form-control">
                <div class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" th:field="*{email}" class="form-control">
                <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Phone (10 digits)</label>
                <input type="text" th:field="*{phone}" class="form-control">
                <div class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Department</label>
                <input type="text" th:field="*{department}" class="form-control">
                <div class="text-danger" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Salary</label>
                <input type="number" step="0.01" th:field="*{salary}" class="form-control">
                <div class="text-danger" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
            </div>
            <button type="submit" class="btn btn-success">Save Employee</button>
        </form>
    </div>
</div>

<!-- Employee Table -->
<h3>Employee List</h3>
<table class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Full Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Department</th>
        <th>Salary</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="emp : ${listEmployees}">
        <td th:text="${emp.id}"></td>
        <td th:text="${emp.fullName}"></td>
        <td th:text="${emp.email}"></td>
        <td th:text="${emp.phone}"></td>
        <td th:text="${emp.department}"></td>
        <td th:text="${emp.salary}"></td>
        <td>
            <a th:href="@{/employees/{id}/edit(id=${emp.id})}" class="btn btn-warning btn-sm">Edit</a>
            <form th:action="@{/employees/{id}/delete(id=${emp.id})}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure?')">Delete</button>
            </form>
        </td>
    </tr>
    <tr th:if="${listEmployees.empty}">
        <td colspan="7" class="text-center">No employees found.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
